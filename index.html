<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080C1A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sleep &amp; Mind Lab</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Space Grotesk (números/títulos) + Archivo (UI/texto): la identidad
     que se definió en el Design Canvas. Se cachean solas la primera vez
     que se abre con internet (el service worker cachea cualquier GET que
     pase, no solo los 4 archivos originales) así después funcionan
     offline igual; si por algo no llegaran a cachearse, cae a la pila de
     fuentes de sistema declarada abajo sin romper nada. -->
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080C1A;
  --surface:#111834;
  --surface-2:#182044;
  --line:#182044;
  --line-2:#232C56;
  --ink:#EEF2FF;
  --muted:#8590BC;
  --accent:#7C6CF8;
  --accent-hover:#8F81FF;
  --accent-press:#6B5BE6;
  --accent-2:#3FD8E4;
  --on-accent:#0A0E1F;
  --good:#4ADE9B;
  --warn:#FFB454;
  --bad:#FF6B81;
  --font-display:"Space Grotesk",system-ui,sans-serif;
  --font-sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font-family:var(--font-sans);
  font-size:14px;line-height:1.5;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font-family:inherit;font-size:16px}
b,strong{font-weight:600}

/* ---------- shell ---------- */
#app{
  min-height:100dvh;
  padding:calc(env(safe-area-inset-top) + 10px) 20px calc(env(safe-area-inset-bottom) + 138px);
  max-width:430px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
}
.hidden{display:none !important}

/* ---------- typography ---------- */
h1{font-family:var(--font-display);font-size:26px;line-height:28px;font-weight:700;letter-spacing:-.035em;margin:0}
h2{font-size:16px;line-height:20px;letter-spacing:-.015em;margin:0;font-weight:600}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
.eyebrow{
  font-size:10px;line-height:1;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:9px;
}
.muted{color:var(--muted);font-size:14px}
.tiny{font-size:11px;color:var(--muted)}
.data{font-family:var(--font-display);font-weight:700;letter-spacing:-.04em}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line-2);
  border-radius:18px;padding:18px;
  display:flex;flex-direction:column;gap:0;
}
.card.chart{padding:14px 13px 8px}
.card.elevated{background:var(--surface-2)}
.card.active{border-color:var(--accent)}
.card.tap:active{transform:scale(.985);transition:transform .1s}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- buttons ---------- */
.btn{
  display:block;width:100%;text-align:center;
  background:var(--accent);
  color:var(--on-accent);font-weight:600;font-size:15px;
  padding:0;height:54px;line-height:54px;border-radius:14px;
}
.btn:hover{background:var(--accent-hover)}
.btn:active{background:var(--accent-press)}
.btn.compact{height:44px;line-height:44px;border-radius:12px;font-size:14px}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);background:var(--surface-2)}

/* ---------- stats ---------- */
.stat{flex:1;text-align:center}
.stat b{display:block;font-family:var(--font-display);font-size:32px;font-weight:700;letter-spacing:-.045em;line-height:1.1}
.stat b small{font-size:15px;font-weight:500;color:var(--muted)}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-top:5px;display:block}
.statrow{display:flex;background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:16px 4px}
.statdiv{width:1px;background:var(--line-2);margin:2px 0}

/* ---------- sleep input ---------- */
.hours{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0}
.hours .val{display:flex;align-items:baseline;gap:4px}
.hours .val b{font-family:var(--font-display);font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:1}
.hours .val span{font-family:var(--font-display);font-size:20px;font-weight:500;color:var(--muted)}
.step{width:50px;height:50px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}
.step:hover{border-color:var(--accent)}
.q{flex:1;height:56px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--font-display);font-weight:700;font-size:20px;text-align:center;color:var(--muted)}
.q.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ---------- tests: pantalla completa ---------- */
#arena{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--bg)}
#arena .exit{
  position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:20px;z-index:2;
  font-size:11px;color:var(--muted);padding:6px 10px;border-radius:8px;border:1px solid var(--line-2);
}
.tapzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.tapzone .big{font-family:var(--font-display);font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:.95}
.tapzone .label{font-size:14px;font-weight:500;color:var(--muted);margin-top:12px;max-width:280px}
.seq{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;width:min(280px,78vw);margin-top:26px}
.key{aspect-ratio:1;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--font-display);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.key:active,.key.flash{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* ---------- gráficos ---------- */
svg{display:block;width:100%;overflow:visible}
.axis{stroke:var(--line-2);stroke-width:1}
.gridline{stroke:var(--line);stroke-width:1}
.gl{fill:var(--muted);font-size:9.5px;font-family:var(--font-sans)}

/* ---------- nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:84px;
  display:flex;align-items:flex-start;padding:0 6px calc(env(safe-area-inset-bottom));
  background:rgba(8,12,26,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line-2);
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--muted)}
nav button svg{margin-top:9px}
nav button .bar{width:26px;height:2px;border-radius:2px;background:transparent}
nav button.on{color:var(--ink)}
nav button.on .bar{background:var(--accent)}
nav button span{font-size:10px;font-weight:600;letter-spacing:.02em}

/* ---------- desktop / pantallas anchas ---------- */
@media (min-width:820px){
  body::before,body::after{
    content:'';position:fixed;top:0;bottom:0;width:1px;
    background:var(--line-2);z-index:1;opacity:.6;
  }
  body::before{left:calc(50% - 300px)}
  body::after{left:calc(50% + 300px)}
  #app{max-width:600px;padding:96px 40px 64px}
  nav{
    left:0;right:0;top:0;bottom:auto;height:auto;
    justify-content:center;gap:4px;align-items:center;
    border-top:0;border-bottom:1px solid var(--line-2);
    padding:14px 10px;
  }
  nav button{flex:none;flex-direction:row;gap:9px;padding:8px 16px;border-radius:10px}
  nav button svg{margin-top:0}
  nav button .bar{display:none}
  nav button:hover{color:var(--ink)}
  nav button.on{background:var(--surface-2)}
  .card.tap:hover{border-color:var(--accent)}
}

/* ---------- misc ---------- */
.bar-track{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent-2);border-radius:4px}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:5px 9px;border-radius:8px;background:rgba(133,144,188,.1);border:1px solid var(--line-2);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pill.good{color:var(--good);background:rgba(74,222,155,.12);border-color:rgba(74,222,155,.35)}
.pill.warn{color:var(--warn);background:rgba(255,180,84,.12);border-color:rgba(255,180,84,.35)}
.pill.bad{color:var(--bad);background:rgba(255,107,129,.12);border-color:rgba(255,107,129,.35)}
.rchip{display:inline-block;font-family:var(--font-display);font-size:12px;font-weight:700;padding:4px 8px;border-radius:7px;background:rgba(133,144,188,.1);border:1px solid var(--line-2);color:var(--muted)}
.rchip.strong-good{color:var(--accent-2);background:rgba(63,216,228,.12);border-color:rgba(63,216,228,.4)}
.rchip.strong-warn{color:var(--accent);background:rgba(124,108,248,.12);border-color:rgba(124,108,248,.4)}
ul.list{list-style:none;padding:0;margin:0}
ul.list li{padding:13px 2px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:10px}
ul.list li:last-child{border-bottom:0}
ul.list li span:last-child{font-size:11px;color:var(--muted);text-align:right}
.fade{animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes flashfeedback{0%{opacity:1}100%{opacity:0}}
.feedback{animation:flashfeedback .5s ease forwards}
@media (prefers-reduced-motion:reduce){.fade,.feedback{animation:none}}
.mark{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center}
.divider{height:1px;background:var(--line-2);margin:0 -18px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="hidden"></nav>
<div id="arena" class="hidden"></div>

<script>
/* ============ almacenamiento seguro ============ */
const mem = {};
const DB = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):(k in mem?mem[k]:d);}catch(e){ return (k in mem)?mem[k]:d; } },
  set(k,v){ mem[k]=v; try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ============ estado ============ */
const today = () => new Date().toISOString().slice(0,10);
const dayLabel = s => { const d=new Date(s+'T12:00'); return d.toLocaleDateString('es',{day:'numeric',month:'short'}); };

let S = DB.get('sml_data', { days:{}, challengeStart:null, name:null });
const save = () => DB.set('sml_data', S);
function day(d=today()){ if(!S.days[d]) S.days[d]={sleep:null,quality:null,reaction:null,memory:null,attention:null}; return S.days[d]; }
const dates = () => Object.keys(S.days).sort();
const withData = () => dates().filter(d=>S.days[d].sleep!=null);

/* ============ métricas ============ */
function cogScore(d){
  const r=[];
  if(d.reaction!=null) r.push(clamp(100-(d.reaction-180)/4,0,100));
  if(d.memory!=null)   r.push(clamp(d.memory*11,0,100));
  if(d.attention!=null)r.push(clamp(d.attention,0,100));
  return r.length? Math.round(r.reduce((a,b)=>a+b)/r.length) : null;
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const avg = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : null;
const plural = (n,s,p) => n===1? `1 ${s}` : `${n} ${p}`;

function pearson(xs,ys){
  const n=xs.length; if(n<3) return null;
  const mx=avg(xs), my=avg(ys);
  let num=0,dx=0,dy=0;
  for(let i=0;i<n;i++){const a=xs[i]-mx,b=ys[i]-my;num+=a*b;dx+=a*a;dy+=b*b;}
  return (dx&&dy)? num/Math.sqrt(dx*dy) : null;
}
function pairs(field){
  const xs=[],ys=[];
  withData().forEach(k=>{ const d=S.days[k]; if(d[field]!=null){xs.push(d.sleep);ys.push(d[field]);} });
  return [xs,ys];
}

/* ============ router ============ */
const app = document.getElementById('app');
const navEl = document.getElementById('nav');
let view = DB.get('sml_seen',false) ? 'home' : 'welcome';

const TABS = [
  ['home','Inicio',  `<rect x="2.5" y="2.5" width="13" height="13" rx="3" stroke="currentColor" stroke-width="1.6" fill="none"/>`],
  ['sleep','Sueño',  `<circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6" fill="none"/>`],
  ['tests','Tests',  `<polygon points="9,2.5 15.5,14.5 2.5,14.5" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>`],
  ['data','Datos',   `<rect x="2.4" y="9" width="3.2" height="6.4" fill="currentColor"/><rect x="7.4" y="5.4" width="3.2" height="10" fill="currentColor"/><rect x="12.4" y="2.4" width="3.2" height="13" fill="currentColor"/>`],
  ['ai','Análisis',  `<rect x="4" y="4" width="10" height="10" transform="rotate(45 9 9)" stroke="currentColor" stroke-width="1.6" fill="none"/>`],
];

function go(v){ view=v; render(); window.scrollTo(0,0); }

function render(){
  navEl.classList.toggle('hidden', view==='welcome');
  navEl.innerHTML = TABS.map(([id,label,icon])=>
    `<button class="${view===id?'on':''}" onclick="go('${id}')">
      <span class="bar"></span>
      <svg width="17" height="17" viewBox="0 0 18 18" fill="none">${icon}</svg>
      <span>${label}</span>
    </button>`).join('');
  app.className='fade';
  app.innerHTML = ({welcome:vWelcome,home:vHome,sleep:vSleep,tests:vTests,data:vData,ai:vAI})[view]();
  void app.offsetWidth;
}
window.go = go;

/* Ícono de la app, embebido para reusarlo en la bienvenida: la curva de
   sueño (cian) con un punto de medición (violeta) — mismo mark que
   icon-192/512.png, así la marca es consistente adentro y afuera. */
const LOGO_SVG = `<svg width="30" height="30" viewBox="0 0 48 48"><polyline points="8,31 16,22.5 24,27.5 40,12" fill="none" stroke="#3FD8E4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="31.5" cy="19.5" r="5.2" fill="#7C6CF8"/></svg>`;

/* ============ pantallas ============ */
function vWelcome(){
  return `
  <div style="min-height:82dvh;display:flex;flex-direction:column;justify-content:center;gap:0">
    <div class="mark">${LOGO_SVG}</div>
    <div class="eyebrow" style="margin-top:20px">Sleep &amp; Mind Lab</div>
    <h1 style="font-size:34px;line-height:36px">Conocé cómo dormís, pensás y rendís</h1>
    <p class="muted" style="font-size:14px;line-height:21px;margin:14px 0 0;max-width:300px">Un instrumento de medición para estudiantes. Sin consejos vagos: solo tus datos.</p>
    <div class="card" style="margin-top:20px">
      <div class="eyebrow" style="color:var(--accent-2);margin-bottom:10px">El método</div>
      <p style="margin:0;font-size:13px;line-height:19px">Registrás tus horas de sueño y hacés tres tests cognitivos cortos cada día.</p>
      <p class="muted" style="margin:8px 0 0;font-size:13px;line-height:19px">A los 7 días el laboratorio calcula la correlación entre tu descanso y tu rendimiento.</p>
    </div>
    <div style="display:flex;gap:14px;margin-top:18px">
      <div style="flex:1;border-top:1px solid var(--line-2);padding-top:10px"><div class="data" style="font-size:20px">7</div><div class="tiny" style="margin-top:2px">días</div></div>
      <div style="flex:1;border-top:1px solid var(--line-2);padding-top:10px"><div class="data" style="font-size:20px">3</div><div class="tiny" style="margin-top:2px">tests diarios</div></div>
      <div style="flex:1;border-top:1px solid var(--line-2);padding-top:10px"><div class="data" style="font-size:20px">21</div><div class="tiny" style="margin-top:2px">mediciones</div></div>
    </div>
    <button class="btn" style="margin-top:26px" onclick="DB.set('sml_seen',true);go('sleep')">Comenzar análisis</button>
    <p class="tiny" style="text-align:center;margin:14px 0 0">Datos guardados solo en tu dispositivo. Nadie más los ve.</p>
  </div>`;
}

function vHome(){
  const d = day();
  const done = ['reaction','memory','attention'].filter(k=>d[k]!=null).length;
  const cs = cogScore(d);
  const ds = withData();
  const last7 = ds.slice(-7).map(k=>S.days[k].sleep);
  return `
  <div class="row" style="align-items:flex-end">
    <div>
      <div class="eyebrow">${new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}).toUpperCase()}</div>
      <h1>Resumen de hoy</h1>
    </div>
  </div>
  <p class="muted" style="margin:-6px 0 0">${d.sleep==null?'Todavía no registraste tu sueño de anoche.':`Dormiste ${d.sleep} h · calidad ${d.quality??'—'}/5`}</p>

  <div class="statrow">
    <div class="stat"><b>${d.sleep??'—'}<small>${d.sleep!=null?'h':''}</small></b><span>SUEÑO</span></div>
    <div class="statdiv"></div>
    <div class="stat"><b style="color:var(--accent-2)">${cs??'—'}</b><span>Í. COGNITIVO</span></div>
    <div class="statdiv"></div>
    <div class="stat"><b style="color:var(--warn)">${done}<small>/3</small></b><span>TESTS</span></div>
  </div>

  ${d.sleep==null?`<button class="btn" onclick="go('sleep')">Registrar sueño</button>`
    : done<3?`<button class="btn" onclick="go('tests')">Continuar tests (${3-done} restantes)</button>`
    : `<button class="btn" onclick="go('ai')">Ver tu análisis de hoy</button>`}

  <div class="card chart">
    <div class="row" style="padding:0 5px"><h3 style="margin:0">Sueño · últimos 7 días</h3><span class="tiny">${ds.length} reg.</span></div>
    ${last7.length? sparkline(last7) : `<p class="muted" style="margin:10px 5px 4px;font-size:13px">Registrá al menos un día para ver tu curva.</p>`}
  </div>

  ${challengeCard()}`;
}

function challengeCard(){
  if(!S.challengeStart){
    return `<div class="card elevated">
      <div class="eyebrow" style="color:var(--accent)">Challenge de 7 días</div>
      <h3>Sueño cuidado</h3>
      <p class="muted" style="margin:0 0 14px;font-size:13px;line-height:19px">El laboratorio guarda tu rendimiento actual como línea de base, y a los 7 días te muestra cuánto cambió.</p>
      <button class="btn compact" onclick="startChallenge()">Empezar challenge</button>
    </div>`;
  }
  const start = S.challengeStart;
  const elapsed = Math.floor((new Date(today())-new Date(start))/86400000);
  const inRange = d => d>=start;
  const before=[],after=[];
  dates().forEach(k=>{ const c=cogScore(S.days[k]); if(c==null) return; (inRange(k)?after:before).push(c); });
  const b=avg(before), a=avg(after);
  const diff = (b!=null&&a!=null)? Math.round(a-b) : null;
  return `<div class="card elevated">
    <div class="row"><div class="eyebrow" style="color:var(--accent);margin:0">Challenge de 7 días</div>
    <span class="tiny">día <strong style="color:var(--ink)">${clamp(elapsed+1,1,7)}</strong> / 7</span></div>
    <div class="bar-track" style="margin:12px 0"><i style="width:${clamp((elapsed+1)/7*100,6,100)}%"></i></div>
    <div class="row" style="align-items:flex-end">
      <div style="display:flex;gap:14px">
        <div><div class="tiny">ANTES</div><div class="data" style="font-size:24px;color:var(--muted);margin-top:3px">${b?Math.round(b):'—'}</div></div>
        <div style="padding-bottom:6px;color:var(--good)">→</div>
        <div><div class="tiny">AHORA</div><div class="data" style="font-size:24px;margin-top:3px">${a?Math.round(a):'—'}</div></div>
      </div>
      <span class="pill ${diff==null?'':diff>0?'good':diff<0?'bad':'warn'}">${diff==null?'sin comparar':(diff>0?'+':'')+diff+' pts'}</span>
    </div>
    ${elapsed>=7?`<button class="btn ghost compact" style="margin-top:14px" onclick="S.challengeStart=null;save();render()">Cerrar challenge</button>`:''}
  </div>`;
}
window.startChallenge=()=>{S.challengeStart=today();save();render()};

/* ---- sueño ---- */
let draftH = null, draftQ = null;
function vSleep(){
  const d = day();
  if(draftH===null) draftH = d.sleep ?? 7.5;
  if(draftQ===null) draftQ = d.quality;
  const hist = dates().slice(-14).reverse();
  return `
  <div class="eyebrow">Registro de sueño</div>
  <h1>¿Cuánto dormiste?</h1>
  <div class="card">
    <div class="tiny" style="text-align:center;letter-spacing:.1em">HORAS DORMIDAS</div>

function sleepNote(h){

  return 'Sueño largo: puede indicar deuda acumulada.';
}

/* La "arena" siempre separa el botón Salir (fuera de la zona de toque)
   de la .tapzone que escucha los toques del test — antes compartían
   contenedor y "Salir" también contaba como un toque de reacción. */
const arena = document.getElementById('arena');
function openArena(bodyHtml){
  arena.classList.remove('hidden');
  arena.innerHTML = `<button class="exit" onclick="closeArena()">Salir</button><div class="tapzone" id="tapzone">${bodyHtml}</div>`;
  return document.getElementById('tapzone');
}
let pendingTimeouts = [];
function schedule(fn, ms){ const id=setTimeout(fn,ms); pendingTimeouts.push(id); return id; }
function closeArena(){
  arena.classList.add('hidden'); arena.innerHTML='';
  pendingTimeouts.forEach(clearTimeout); pendingTimeouts=[];
  clearInterval(T2);
  render();
}
window.closeArena = closeArena;
let T2;

window.start = id => ({reaction:runReaction,memory:runMemory,attention:runAttention})[id]();

/* reacción — un toque anticipado avisa y repite el intento, en vez de
   ignorarse en silencio (restaba validez a la medición). */
function runReaction(){
  const times=[]; let n=0, t0=0, ready=false;
  const step=()=>{
    if(n>=5){ const best=Math.round(avg(times)); day().reaction=best; save();
      openArena(`<div class="big">${best} <span style="font-size:22px;color:var(--muted)">ms</span></div><div class="label">Promedio de 5 intentos. Un adulto descansado ronda los 250 ms.</div>
      <button class="btn" style="max-width:260px;margin-top:26px" onclick="closeArena()">Listo</button>`);
      return; }
    ready=false;
    const z = openArena(`<div class="label">${n+1}/5 · esperá al color</div>`);
    z.style.background='var(--bg)';
    z.onclick=()=>{
      if(!ready){
        z.innerHTML = `<div class="label feedback" style="color:var(--warn)">Muy pronto — esperá el color</div>`;
        schedule(()=>step(), 550);
      }
    };
    schedule(()=>{
      z.style.background='var(--accent)';
      z.innerHTML=`<div class="big" style="color:var(--on-accent)">¡Ahora!</div>`;
      ready=true; t0=performance.now();
      z.onclick=()=>{ if(!ready)return; ready=false; times.push(performance.now()-t0); n++; z.style.background='var(--bg)'; z.onclick=null; schedule(step,420); };
    }, 1200+Math.random()*2600);
  };
  step();
}

/* memoria */
function runMemory(){
  let level=2, seq=[], input=[];
  const pad = i => `<button class="key" id="k${i}" onclick="tap(${i})">${i+1}</button>`;
  const board = msg => `<div class="label">${msg}</div><div class="seq">${[...Array(9)].map((_,i)=>pad(i)).join('')}</div>`;
  const show = () => {
    seq=[...Array(level)].map(()=>Math.floor(Math.random()*9)); input=[];
    const z = openArena(board(`Memorizá · nivel ${level}`));
    z.querySelectorAll('.key').forEach(k=>k.style.pointerEvents='none');
    seq.forEach((v,i)=>schedule(()=>{
      const el=document.getElementById('k'+v); if(!el)return;
      el.classList.add('flash'); schedule(()=>el.classList.remove('flash'),380);
    }, 650*i+400));
    schedule(()=>{ const a=document.querySelector('.label'); if(a)a.textContent='Repetila';
      const zz=document.getElementById('tapzone'); if(zz) zz.querySelectorAll('.key').forEach(k=>k.style.pointerEvents='auto'); }, 650*seq.length+450);
  };
  window.tap = i => {
    input.push(i);
    if(input[input.length-1]!==seq[input.length-1]){
      const score=level-1; day().memory=score; save();
      openArena(`<div class="big">Nivel ${score}</div><div class="label">Recordaste ${plural(score,'elemento seguido','elementos seguidos')}. El promedio ronda 5 a 7.</div>
      <button class="btn" style="max-width:260px;margin-top:26px" onclick="closeArena()">Listo</button>`); return;
    }
    if(input.length===seq.length){ level++; schedule(show,600); }
  };
  show();
}

/* atención */
function runAttention(){
  let hits=0, misses=0, falses=0, total=0, left=45;
  const chars='ABCDEFGHJKLMNPRSTUVXYZ', nums='0123456789';
  let current=null, answered=false;
  const tick=()=>{
    if(current&&!answered&&current.isLetter) misses++;
    answered=false;
    const isLetter=Math.random()<0.65;
    const c = isLetter? chars[Math.floor(Math.random()*chars.length)] : nums[Math.floor(Math.random()*10)];
    current={isLetter}; total+= isLetter?1:0;
    const el=document.getElementById('stim'); if(el){ el.textContent=c; el.style.color= 'var(--ink)'; }
    const tl=document.getElementById('tl'); if(tl) tl.textContent=left+' s';
  };
  const z = openArena(`<div class="label" id="tl">45 s</div><div class="big" id="stim" style="font-size:88px">·</div>
    <div class="label">Tocá solo si es una <b>letra</b></div>`);
  z.onclick=()=>{
    if(!current||answered)return; answered=true;
    if(current.isLetter){hits++; flash('var(--good)');} else {falses++; flash('var(--bad)');}
  };
  const flash=c=>{const el=document.getElementById('stim'); if(el){el.style.color=c;}};
  T2=setInterval(()=>{
    left--; tick();
    if(left<=0){
      clearInterval(T2); z.onclick=null;
      const acc = total? clamp(Math.round((hits/total)*100 - falses*4),0,100) : 0;
      day().attention=acc; save();
      openArena(`<div class="big">${acc}%</div><div class="label">${hits} aciertos · ${misses} omisiones · ${falses} errores por impulso.</div>
      <button class="btn" style="max-width:260px;margin-top:26px" onclick="closeArena()">Listo</button>`);
    }
  },1000);
  tick();
}

/* gráficos — spec: trazo de serie 1.8px sin relleno, grilla 1px, ejes 1px,
   tendencia punteada 4/4, puntos r=3 (r=4 el último, resaltado). */
function sparkline(vals, labels){
  if(!vals.length) return '';
  const W=306,H=118,P=8;
  const mn=Math.min(...vals,4), mx=Math.max(...vals,10);
  const x=i=>P+i*(W-2*P)/Math.max(vals.length-1,1);
  const y=v=>H-28-((v-mn)/((mx-mn)||1))*(H-40);
  const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const grid=[.15,.5,.85].map(t=>`<line class="gridline" x1="0" y1="${8+t*(H-40)}" x2="${W}" y2="${8+t*(H-40)}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="margin-top:8px">
    ${grid}
    <polyline points="${pts}" fill="none" stroke="var(--accent-2)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?4:3}" fill="${i===vals.length-1?'var(--accent)':'var(--accent-2)'}"/>`).join('')}
    ${labels?labels.map((l,i)=> i%Math.ceil(labels.length/4)===0?`<text class="gl" x="${x(i)}" y="${H-6}" text-anchor="middle">${l}</text>`:'').join(''):''}
  </svg>`;
}
function scatter(xs,ys,unit,good){
  const W=306,H=92,P=34;
  const yMinV=Math.min(...ys), yMaxV=Math.max(...ys);
  const pad=(yMaxV-yMinV)*.15||1;
  const lo=yMinV-pad, hi=yMaxV+pad;
  const xm=4.3, xM=8.7;
  const px=v=>P+((v-xm)/(xM-xm))*(W-P-6);
  const py=v=>76-((v-lo)/((hi-lo)||1))*64;
  const n=xs.length, mx=avg(xs), my=avg(ys);
  let num=0,den=0; for(let i=0;i<n;i++){num+=(xs[i]-mx)*(ys[i]-my);den+=(xs[i]-mx)**2;}
  const m=den?num/den:0, b=my-m*mx;
  const accent = good? 'var(--accent-2)' : 'var(--accent)';
  return `<svg viewBox="0 0 ${W} ${H}" style="margin-top:6px">
    <line class="gridline" x1="${P}" y1="12" x2="${W-6}" y2="12"/>
    <line class="gridline" x1="${P}" y1="44" x2="${W-6}" y2="44"/>
    <line class="axis" x1="${P}" y1="76" x2="${W-6}" y2="76"/>
    <line class="axis" x1="${P}" y1="12" x2="${P}" y2="76"/>
    <line x1="${px(xm)}" y1="${py(m*xm+b)}" x2="${px(xM)}" y2="${py(m*xM+b)}" stroke="${accent}" stroke-width="1.4" stroke-dasharray="4 4" opacity=".85"/>
    ${xs.map((v,i)=>`<circle cx="${px(v)}" cy="${py(ys[i])}" r="${i===xs.length-1?4:3}" fill="${i===xs.length-1?'var(--ink)':accent}"/>`).join('')}
    <text class="gl" x="4" y="16">${Math.round(hi)}${unit==='%'?'%':''}</text>
    <text class="gl" x="4" y="80">${Math.round(lo)}${unit==='%'?'%':''}</text>
    <text class="gl" x="${P}" y="90" text-anchor="middle">${xm}h</text>
    <text class="gl" x="${(P+W-6)/2}" y="90" text-anchor="middle">${((xm+xM)/2).toFixed(1)}h</text>
    <text class="gl" x="${W-6}" y="90" text-anchor="end">${xM}h</text>
  </svg>`;
}

function analyze(){
  const out=[];
  const ds=withData();
  if(ds.length<3){
    out.push({tag:'Datos',tone:'var(--warn)',title:'Todavía es pronto para conclusiones',
      body:`Llevás ${plural(ds.length,'día','días')}. Con 5 a 7 días el laboratorio ya puede separar una tendencia real de un día malo suelto.`});
  }
  const sleeps=ds.map(k=>S.days[k].sleep);
  if(sleeps.length){
    const m=avg(sleeps);
    out.push({tag:'Sueño',tone:m<7?'var(--warn)':'var(--good)',
      title:`Dormís ${m.toFixed(1)} h en promedio`,
      body: m<6.5? 'Estás bastante por debajo de las 8–10 h recomendadas para tu edad. A este nivel, la caída de atención suele notarse antes que la de memoria.'
          : m<8? 'Estás apenas por debajo del rango recomendado. Sumar 45 minutos suele ser el cambio más rentable.'
          : 'Estás dentro del rango recomendado para adolescentes.'});
    const sd = Math.sqrt(avg(sleeps.map(v=>(v-m)**2)));
    if(sleeps.length>=3 && sd>1.3) out.push({tag:'Regularidad',tone:'var(--accent)',
      title:'Tus horarios son irregulares',
      body:`Tu sueño varía ±${sd.toFixed(1)} h entre días. La irregularidad afecta el rendimiento casi tanto como dormir poco, porque desalinea el reloj biológico.`});
  }
  [['reaction','tiempo de reacción',true],['memory','memoria',false],['attention','atención',false]].forEach(([f,name,inv])=>{
    const [xs,ys]=pairs(f); const r=pearson(xs,ys);
    if(r==null) return;
    const helps = inv ? r<-0.3 : r>0.3;
    const hurts = inv ? r>0.3 : r<-0.3;
    if(helps) out.push({tag:'Correlación',tone:'var(--accent-2)',title:`Dormir más mejora tu ${name}`,
      body:`En tus ${plural(xs.length,'día medido','días medidos')} la relación es clara (r = ${r.toFixed(2)}). ${inv?'Tus noches largas bajan los milisegundos de respuesta.':'Tus mejores puntajes caen en tus noches más largas.'}`});
    else if(hurts) out.push({tag:'Anomalía',tone:'var(--warn)',title:`Tu ${name} no sigue al sueño`,
      body:`La relación va al revés de lo esperado (r = ${r.toFixed(2)}). Suele pasar cuando hacés los tests a horas muy distintas o cuando hay práctica: mejorás por repetición, no por descanso.`});
    else out.push({tag:'Correlación',tone:'var(--muted)',title:`Sin relación clara con tu ${name}`,
      body:`r = ${r.toFixed(2)} sobre ${plural(xs.length,'día','días')}. O el efecto es chico, o falta rango: si todos tus días son parecidos en horas, no hay contraste que medir.`});
  });
  return out;
}

function recos(){
  const ds=withData(); const r=[];
  const m = ds.length? avg(ds.map(k=>S.days[k].sleep)) : null;
  const best = ds.map(k=>({k,c:cogScore(S.days[k])})).filter(o=>o.c!=null).sort((a,b)=>b.c-a.c)[0];
  if(m!=null && m<8) r.push(`Adelantá la hora de dormir 30 min esta semana.`);
  if(best) r.push(`Tu mejor día fue el ${dayLabel(best.k)} con ${S.days[best.k].sleep} h: usá eso como objetivo.`);
  r.push('Estudiá lo más difícil en tus primeras horas despiertas, no de madrugada.');
  r.push('Hacé los tests siempre a la misma hora para que la comparación sea válida.');
  if(!S.challengeStart) r.push('Arrancá el challenge de 7 días para medir un antes y un después.');
  return r;
}

/* Compartir — antes: si navigator.share fallaba o no existía (Chrome de
   escritorio, por ejemplo) cualquier error quedaba silenciado o caía en
   un alert() feo, y parecía que el botón "no hacía nada". Ahora siempre
   da una señal: comparte de verdad si puede, y si no, copia el link al
   portapapeles y lo confirma con un toast en vez de un alert. */
window.shareApp = () => {
  const txt='Sleep & Mind Lab: medí cómo tu sueño afecta tu concentración, memoria y reacción.';
  const url = location.href;
  if(navigator.share){
    navigator.share({title:'Sleep & Mind Lab',text:txt,url}).catch(()=>{});
    return;
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url)
      .then(()=>toast('Link copiado al portapapeles'))
      .catch(()=>promptFallback());
  } else promptFallback();
  function promptFallback(){ window.prompt('Copiá el link:', url); }
};
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink);font-size:13px;font-weight:600;padding:11px 18px;border-radius:99px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; }, 2200);
}

/* arranque */
render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
